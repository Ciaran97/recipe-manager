name: recipe-manager-dev
services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: recipe_manager
      POSTGRES_USER: recipe_manager
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${RECIPE_MANAGER_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_manager -d recipe_manager"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
secrets:
  postgres_password:
    file: ${RECIPE_MANAGER_POSTGRES_PASSWORD_FILE:-./secrets/postgres-password}
volumes:
  postgres_data:
