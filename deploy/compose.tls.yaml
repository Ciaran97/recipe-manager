services:
  app:
    environment:
      Proxy__TrustedAddresses: ${RECIPE_MANAGER_TLS_PROXY_IP:?Run configure-self-hosting.py first}
  proxy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    environment:
      RECIPE_MANAGER_HOST: ${RECIPE_MANAGER_HOST:?Set the household server host}
    ports:
      - "${RECIPE_MANAGER_TLS_BIND_ADDRESS:-0.0.0.0}:${RECIPE_MANAGER_TLS_HTTP_PORT:-80}:80"
      - "${RECIPE_MANAGER_TLS_BIND_ADDRESS:-0.0.0.0}:${RECIPE_MANAGER_TLS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    tmpfs: ["/tmp:mode=1777,size=32m"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      default:
        ipv4_address: ${RECIPE_MANAGER_TLS_PROXY_IP}
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
volumes:
  tls_data:
  tls_config:
