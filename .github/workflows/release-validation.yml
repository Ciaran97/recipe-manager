name: Release validation
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-web:
    uses: ./.github/workflows/backend-web.yml
  native-unit:
    uses: ./.github/workflows/ios.yml
  native-acceptance:
    # Explicit dispatch on a trusted, isolated macOS runner with Docker, pinned
    # Xcode/SDK/Node and installed simulator. Never run untrusted PR code here.
    runs-on: [self-hosted, macOS, recipe-manager-release]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: npm ci --prefix src/RecipeManager.Web
      - run: npm ci --prefix tests/e2e
      - run: npx --prefix tests/e2e playwright install chromium
      - run: dotnet restore RecipeManager.slnx --locked-mode
      - run: scripts/validate-release.sh --native-acceptance
  required:
    if: always()
    needs: [backend-web, native-unit, native-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all executable checks
        run: |
          test '${{ needs.backend-web.result }}' = success
          test '${{ needs.native-unit.result }}' = success
          test '${{ needs.native-acceptance.result }}' = success
      - name: Retain manual release gates
        run: echo 'A green workflow is not publication approval. Complete docs/release-checklist.md.'
