name: Native app and Share Extension
"on":
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select pinned Xcode without changing the host default
        shell: bash
        run: |
          candidate="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$candidate" ]; then
            echo "::error::Required Xcode ${XCODE_VERSION} is not installed on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          actual=$(DEVELOPER_DIR="$candidate" xcodebuild -version)
          printf '%s\n' "$actual"
          if [[ "${actual%%$'\n'*}" != "Xcode ${XCODE_VERSION}" ]]; then
            echo "::error::Selected Xcode does not match ${XCODE_VERSION}."
            exit 1
          fi
          echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix scripts/contracts
      - run: npm ci --prefix src/RecipeManager.Web
      - run: dotnet restore RecipeManager.slnx --locked-mode
      - run: scripts/check-contracts.sh --check
      - name: Resolve locked native dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/RecipeManager.xcodeproj -scheme RecipeManager -onlyUsePackageVersionsFromResolvedFile
      - name: Build app with embedded Share Extension
        run: xcodebuild -project ios/RecipeManager.xcodeproj -scheme RecipeManager -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Select an installed iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" <<'PYTHON'
          import json,os,sys
          groups=json.load(open(sys.argv[1]))['devices']
          devices=[d for group in groups.values() for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not devices: raise SystemExit('An iPhone simulator runtime is required')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+devices[0]['udid']+'\n')
          PYTHON
      - name: Native unit and handoff tests
        run: xcodebuild -project ios/RecipeManager.xcodeproj -scheme RecipeManager -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test -only-testing:RecipeManagerTests -only-testing:ShareHandoffTests
      - name: Extension-safe handoff tests
        run: xcodebuild -project ios/RecipeManager.xcodeproj -scheme ShareHandoff -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
