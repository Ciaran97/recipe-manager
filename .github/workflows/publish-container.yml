name: Publish pre-release container
"on":
  release:
    # published also covers a pre-release published from a draft.
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-container-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  backend-web:
    if: github.event.release.prerelease == true
    uses: ./.github/workflows/backend-web.yml
  ios:
    if: github.event.release.prerelease == true
    uses: ./.github/workflows/ios.yml
  publish:
    if: github.event.release.prerelease == true
    needs: [backend-web, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Release tag must be a valid Docker tag (for example v0.1.0-beta.1).'
            exit 1
          fi
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published `%s:%s`\n\nPinned reference: `%s@%s`\n' "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
