name: Backend and web
"on":
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: python3 scripts/test-update-server.py
      - run: npm ci --prefix tests/e2e
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - run: npm ci --prefix scripts/contracts
      - run: npm ci --prefix src/RecipeManager.Web
      - run: dotnet restore RecipeManager.slnx --locked-mode
      - run: scripts/check-contracts.sh --typescript
      - run: dotnet build RecipeManager.slnx --no-restore
      - run: dotnet format RecipeManager.slnx --no-restore --verify-no-changes
      - run: node --test tests/performance/measurement.test.js tests/performance/native-control.test.js
      - run: dotnet test RecipeManager.slnx --no-build --no-restore
      - name: Isolated browser acceptance
        run: npm --prefix tests/e2e test
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/RecipeManager.Web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/RecipeManager.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm audit --audit-level=high
